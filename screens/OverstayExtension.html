<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4">

<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors duration-200 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary font-bold">تمديد الحجز</h1>
<div class="w-10 h-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Scrollable Area -->
<main class="flex-1 overflow-y-auto px-container-margin py-md flex flex-col gap-lg pb-32">
<!-- Current Booking Card -->
<section class="bg-custom-navy rounded-xl border border-custom-border p-md flex flex-col gap-sm relative overflow-hidden">
<div class="absolute -left-4 -top-4 w-24 h-24 bg-primary/5 rounded-full blur-xl pointer-events-none"></div>
<div class="flex justify-between items-start">
<div>
<h2 class="font-label-sm text-label-sm text-on-surface-variant mb-1">النزيل الحالي</h2>
<p class="font-headline-sm text-headline-sm text-on-surface">محمد أحمد</p>
</div>
<div class="bg-surface-container rounded-lg px-3 py-1 flex items-center gap-2 border border-custom-border">
<span class="material-symbols-outlined text-primary text-sm" data-icon="apartment">apartment</span>
<span class="font-label-lg text-label-lg text-on-surface">شقة 402</span>
</div>
</div>
<div class="mt-2 pt-3 border-t border-custom-border flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="event_busy">event_busy</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">تاريخ الخروج الحالي: <span class="text-on-surface font-medium">15 مايو 2024</span></p>
</div>
</section>
<!-- Season Pressure Selector -->
<section class="flex flex-col gap-md">
<h3 class="font-label-lg text-label-lg text-on-surface">موسم الضغط</h3>
<!-- Segmented Control -->
<div class="flex bg-surface-container rounded-xl p-1 border border-custom-border">
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg bg-custom-navy text-on-surface shadow-sm border border-custom-border transition-all">
                        ضغط عالي
                    </button>
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface transition-all">
                        ضغط منخفض
                    </button>
</div>
<!-- High Pressure Active State Content -->
<div class="bg-custom-navy rounded-xl border border-custom-border p-md flex flex-col gap-sm">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="trending_up">trending_up</span>
<div>
<p class="font-body-md text-body-md text-on-surface">السعر سيكون بسعر اليوم الحالي</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">يتم تطبيق تسعيرة المواسم المرتفعة تلقائياً.</p>
</div>
</div>
<div class="mt-2 self-end bg-error/10 border border-error/30 rounded-lg px-3 py-1.5 flex items-center gap-2">
<span class="font-label-lg text-label-lg text-error">500 ج.م / يوم</span>
</div>
</div>
</section>
<!-- Extension Duration -->

<button class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-primary hover:bg-surface-variant transition-colors border border-custom-border">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<div class="flex-1 text-center flex flex-col justify-center">

</div>
