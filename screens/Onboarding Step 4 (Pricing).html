<body class="bg-background text-on-background min-h-screen flex flex-col justify-between">
<!-- Minimal Header for Focused View (Exception Rule) -->
<header class="w-full px-container-margin py-md flex items-center justify-between bg-surface-container-low border-b border-surface-variant">
<button class="text-on-surface hover:text-primary transition-colors flex items-center justify-center p-sm rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<span class="font-headline-sm text-on-surface">الإعداد السريع</span>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow flex flex-col items-center px-container-margin pt-xl pb-xl overflow-y-auto">
<!-- Progress Indicators -->
<div class="flex w-full max-w-[480px] flex-row items-center justify-center gap-sm py-md mb-md">
<div class="h-unit w-full rounded-full bg-primary"></div>
<div class="h-unit w-full rounded-full bg-primary"></div>
<div class="h-unit w-full rounded-full bg-primary"></div>
<div class="h-unit w-full rounded-full bg-primary"></div>
<span class="text-on-surface-variant font-label-sm whitespace-nowrap px-sm">4 من 4</span>
</div>
<h1 class="text-on-surface font-headline-lg text-center pb-xl pt-sm">إعدادات التسعير</h1>
<div class="w-full max-w-[480px] flex flex-col gap-lg">
<!-- Input 1 -->
<div class="flex flex-col w-full gap-sm">
<label class="text-on-surface font-label-lg" for="default-price">سعر الليلة الافتراضي</label>
<div class="relative">
<input class="w-full rounded-lg bg-surface-container-high border border-outline-variant text-on-surface font-body-md py-sm px-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-outline h-12" id="default-price" placeholder="أدخل السعر" type="number"/>
<span class="absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant font-body-sm">ريال</span>
</div>
</div>
<!-- Input 2 -->
<div class="flex flex-col w-full gap-sm">
<label class="text-on-surface font-label-lg" for="broker-fee">نسبة زيادة عمولة السمسار %</label>
<div class="relative">
<input class="w-full rounded-lg bg-surface-container-high border border-outline-variant text-on-surface font-body-md py-sm px-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-outline h-12" id="broker-fee" placeholder="0" type="number"/>
<span class="absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant font-body-sm">%</span>
</div>
</div>
<!-- Input 3 -->
<div class="flex flex-col w-full gap-sm">
<label class="text-on-surface font-label-lg" for="peak-fee">نسبة زيادة أيام الذروة (خميس-سبت) %</label>
<div class="relative">
<input class="w-full rounded-lg bg-surface-container-high border border-outline-variant text-on-surface font-body-md py-sm px-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-outline h-12" id="peak-fee" placeholder="0" type="number"/>
<span class="absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant font-body-sm">%</span>
</div>
</div>
</div>
</main>
<!-- Bottom Actions -->
<footer class="w-full px-container-margin py-lg bg-surface-container-lowest border-t border-surface-variant flex justify-center">
<div class="w-full max-w-[480px] flex flex-row gap-md justify-between">
<button class="flex-1 py-sm px-md rounded-lg border border-outline text-on-surface font-label-lg hover:bg-surface-variant transition-colors flex items-center justify-center h-12">

</footer>
