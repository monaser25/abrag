<!DOCTYPE html>

<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إضافة مصروف جديد</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#263046",
                        "on-error": "#690005",
                        "tertiary-fixed": "#d7e2ff",
                        "surface-dim": "#111412",
                        "surface-container-highest": "#333533",
                        "error-container": "#93000a",
                        "background": "#111412",
                        "primary-container": "#00b4d8",
                        "on-tertiary-fixed": "#101b30",
                        "on-secondary-container": "#a8b6ca",
                        "on-tertiary-container": "#303b51",
                        "surface": "#111412",
                        "error": "#ffb4ab",
                        "tertiary": "#bbc6e2",
                        "inverse-surface": "#e2e3df",
                        "surface-container": "#1e201e",
                        "surface-bright": "#373a37",
                        "primary-fixed-dim": "#4cd6fb",
                        "on-surface": "#e2e3df",
                        "primary-fixed": "#b3ebff",
                        "surface-container-high": "#282b28",
                        "secondary-container": "#3a4859",
                        "on-background": "#e2e3df",
                        "on-secondary-fixed": "#0f1c2c",
                        "on-primary-fixed-variant": "#004e5f",
                        "surface-tint": "#4cd6fb",
                        "surface-container-lowest": "#0c0f0d",
                        "secondary": "#bac8dc",
                        "secondary-fixed-dim": "#bac8dc",
                        "surface-container-low": "#1a1c1a",
                        "on-primary-container": "#00414f",
                        "surface-variant": "#333533",
                        "inverse-primary": "#00677d",
                        "on-tertiary-fixed-variant": "#3c475d",
                        "on-primary": "#003642",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#9aa5bf",
                        "outline": "#869398",
                        "inverse-on-surface": "#2f312e",
                        "tertiary-fixed-dim": "#bbc6e2",
                        "on-secondary-fixed-variant": "#3a4859",
                        "on-primary-fixed": "#001f27",
                        "on-secondary": "#243141",
                        "primary": "#4cd6fb",
                        "on-surface-variant": "#bcc9ce",
                        "outline-variant": "#3d494d",
                        "secondary-fixed": "#d6e4f9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "40px",
                        "lg": "24px",
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "unit": "4px",
                        "gutter": "16px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "label-lg": ["IBM Plex Sans Arabic"],
                        "body-sm": ["IBM Plex Sans Arabic"],
                        "label-sm": ["IBM Plex Sans Arabic"],
                        "body-md": ["IBM Plex Sans Arabic"],
                        "headline-sm": ["IBM Plex Sans Arabic"],
                        "headline-md": ["IBM Plex Sans Arabic"],
                        "headline-lg": ["IBM Plex Sans Arabic"],
                        "body-lg": ["IBM Plex Sans Arabic"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["30px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0">
<!-- Top App Bar -->
<header class="bg-background dark:bg-background docked full-width top-0 z-50">
<div class="flex flex-row-reverse justify-between items-center w-full px-container-margin py-md">
<!-- Back Button (RTL mapping: arrow_forward pointing right acts as 'Back' logically) -->
<button aria-label="Back" class="text-on-surface-variant hover:bg-surface-variant transition-colors p-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary">إضافة مصروف جديد</h1>
<!-- Trailing (Empty for balance or optional action) -->
<div class="w-10"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-container-margin py-lg max-w-3xl mx-auto">
<!-- Form Container -->
<div class="bg-[#1B263B] border border-[#415A77]/30 rounded-xl p-md md:p-lg shadow-lg">
<form class="space-y-lg">
<!-- Field 1: Expense Type -->
<div class="flex flex-col space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="expense-type">نوع المصروف</label>
<div class="relative">
<select class="w-full bg-white text-[#111412] font-body-md text-body-md rounded-lg border-none focus:ring-2 focus:ring-primary focus:outline-none px-md py-sm appearance-none rtl-select" id="expense-type" name="expense-type">
<option disabled="" selected="" value="">اختر نوع المصروف</option>
<option value="electricity">كهرباء</option>
<option value="water">مياه</option>
<option value="gas">غاز</option>
<option value="cleaning">نظافة</option>
<option value="maintenance">صيانة</option>
<option value="other">أخرى</option>
</select>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-2 text-surface-dim">
<span class="material-symbols-outlined text-surface-dim">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Field 2: Property / Apartment -->
<div class="flex flex-col space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="property">العقار / الشقة</label>
<div class="relative">
<select class="w-full bg-white text-[#111412] font-body-md text-body-md rounded-lg border-none focus:ring-2 focus:ring-primary focus:outline-none px-md py-sm appearance-none rtl-select" id="property" name="property">
<option value="general">عام</option>
<option value="apt1">شقة 1</option>
<option value="apt2">شقة 2</option>
<option value="apt3">شقة 3</option>
<option value="apt4">شقة 4</option>
<option value="apt5">شقة 5</option>
</select>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-2 text-surface-dim">
<span class="material-symbols-outlined text-surface-dim">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Grouped Fields: Amount & Date -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Field 3: Amount -->
<div class="flex flex-col space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="amount">المبلغ (ج.م)</label>
<input class="w-full bg-white text-[#111412] font-body-md text-body-md rounded-lg border-none focus:ring-2 focus:ring-primary focus:outline-none px-md py-sm placeholder-[#869398]" dir="ltr" id="amount" name="amount" placeholder="0.00" type="number"/>
</div>
<!-- Field 4: Date -->
<div class="flex flex-col space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="date">التاريخ</label>
<input class="w-full bg-white text-[#111412] font-body-md text-body-md rounded-lg border-none focus:ring-2 focus:ring-primary focus:outline-none px-md py-sm" id="date" name="date" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Field 5: Meter Reading (Conditional - Visualized as visible for demo) -->
<div class="flex flex-col space-y-sm bg-[#111412]/50 p-sm rounded-lg border border-[#415A77]/20">
<div class="flex justify-between items-center mb-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="meter-reading">قراءة العداد</label>
<span class="font-label-sm text-label-sm text-error bg-error/10 px-2 py-1 rounded-sm">مطلوب للكهرباء</span>
</div>
<input class="w-full bg-white text-[#111412] font-body-md text-body-md rounded-lg border-none focus:ring-2 focus:ring-primary focus:outline-none px-md py-sm placeholder-[#869398]" dir="ltr" id="meter-reading" name="meter-reading" placeholder="أدخل قراءة العداد" type="number"/>
</div>
<!-- Field 6: Notes -->
<div class="flex flex-col space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="notes">ملاحظات</label>
<textarea class="w-full bg-white text-[#111412] font-body-md text-body-md rounded-lg border-none focus:ring-2 focus:ring-primary focus:outline-none px-md py-sm placeholder-[#869398] resize-none" id="notes" name="notes" placeholder="تفاصيل إضافية (اختياري)..." rows="4"></textarea>
</div>
<!-- Save Button -->
<div class="pt-md">
<button class="w-full bg-primary-container text-[#111412] font-label-lg text-label-lg py-md px-lg rounded-xl hover:bg-primary-container/90 transition-colors shadow-sm flex justify-center items-center gap-sm" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                        حفظ المصروف
                    </button>
</div>
</form>
</div>
</main>
</body></html>
