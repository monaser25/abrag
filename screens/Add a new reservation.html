<style>
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Transactional intent - no main nav shell) -->
<header class="bg-background text-primary px-container-margin py-md flex items-center justify-between sticky top-0 z-10 w-full">
<button aria-label="العودة" class="text-on-surface-variant hover:bg-surface-variant transition-colors p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="button">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary flex-1 text-center">إضافة حجز جديد</h1>
<!-- Invisible placeholder to balance flex layout -->
<div class="w-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto px-container-margin pb-xl pt-sm flex flex-col gap-lg">
<!-- Form Container -->
<form class="bg-[#1B263B] rounded-xl border border-[#415A77]/30 shadow-lg p-lg flex flex-col gap-md">
<!-- Form Section: Property Details -->
<fieldset class="flex flex-col gap-md">
<legend class="sr-only">تفاصيل العقار</legend>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="apartment_number">رقم الشقة</label>
<div class="relative">
<select class="w-full bg-white text-on-tertiary-fixed rounded-lg border-none focus:ring-2 focus:ring-primary h-12 px-4 appearance-none font-body-md text-body-md pr-10 text-right cursor-pointer shadow-sm" id="apartment_number" name="apartment_number">
<option disabled="" selected="" value="">اختر الشقة</option>
<option value="101">101</option>
<option value="102">102</option>
<option value="103">103</option>
<option value="201">201</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-[#101b30]">
<span class="material-symbols-outlined">apartment</span>
</div>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-[#101b30]">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</fieldset>
<hr class="border-[#415A77]/20 my-2"/>
<!-- Form Section: Guest Details -->
<fieldset class="flex flex-col gap-md">
<legend class="sr-only">بيانات الضيف</legend>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="guest_name">الاسم الكامل للضيف</label>
<div class="relative">
<input class="w-full bg-white text-on-tertiary-fixed rounded-lg border-none focus:ring-2 focus:ring-primary h-12 px-4 font-body-md text-body-md pr-10 text-right shadow-sm placeholder:text-gray-400" id="guest_name" name="guest_name" placeholder="أدخل اسم الضيف" type="text"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-[#101b30]">
<span class="material-symbols-outlined">person</span>
</div>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="national_id">رقم الهوية الوطنية</label>
<div class="relative">
<input class="w-full bg-white text-on-tertiary-fixed rounded-lg border-none focus:ring-2 focus:ring-primary h-12 px-4 font-body-md text-body-md pr-10 text-right shadow-sm placeholder:text-gray-400" id="national_id" name="national_id" placeholder="أدخل رقم الهوية" type="text"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-[#101b30]">
<span class="material-symbols-outlined">badge</span>
</div>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="phone_number">رقم الهاتف</label>
<div class="relative">
<input class="w-full bg-white text-on-tertiary-fixed rounded-lg border-none focus:ring-2 focus:ring-primary h-12 px-4 font-body-md text-body-md pr-10 text-right shadow-sm placeholder:text-gray-400" dir="ltr" id="phone_number" name="phone_number" placeholder="أدخل رقم الهاتف" type="tel"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-[#101b30]">
<span class="material-symbols-outlined">call</span>
</div>
</div>
</div>
</div>
</fieldset>
<hr class="border-[#415A77]/20 my-2"/>
<!-- Form Section: Booking Dates & Financials -->
<fieldset class="flex flex-col gap-md">
<legend class="sr-only">تواريخ الحجز والتكلفة</legend>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="check_in">تاريخ تسجيل الدخول</label>
<div class="relative">
<input class="w-full bg-white text-on-tertiary-fixed rounded-lg border-none focus:ring-2 focus:ring-primary h-12 px-4 font-body-md text-body-md pr-10 text-right shadow-sm cursor-pointer [&amp;::-webkit-calendar-picker-indicator]:opacity-0 [&amp;::-webkit-calendar-picker-indicator]:absolute [&amp;::-webkit-calendar-picker-indicator]:inset-0 [&amp;::-webkit-calendar-picker-indicator]:w-full [&amp;::-webkit-calendar-picker-indicator]:cursor-pointer" id="check_in" name="check_in" type="date"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-[#101b30]">
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="check_out">تاريخ المغادرة</label>
<div class="relative">
<input class="w-full bg-white text-on-tertiary-fixed rounded-lg border-none focus:ring-2 focus:ring-primary h-12 px-4 font-body-md text-body-md pr-10 text-right shadow-sm cursor-pointer [&amp;::-webkit-calendar-picker-indicator]:opacity-0 [&amp;::-webkit-calendar-picker-indicator]:absolute [&amp;::-webkit-calendar-picker-indicator]:inset-0 [&amp;::-webkit-calendar-picker-indicator]:w-full [&amp;::-webkit-calendar-picker-indicator]:cursor-pointer" id="check_out" name="check_out" type="date"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-[#101b30]">
<span class="material-symbols-outlined">event_busy</span>
</div>
</div>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md items-end">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="daily_price">السعر اليومي (رس)</label>
<div class="relative">
<input class="w-full bg-white text-on-tertiary-fixed rounded-lg border-none focus:ring-2 focus:ring-primary h-12 px-4 font-body-md text-body-md pr-10 text-right shadow-sm placeholder:text-gray-400" id="daily_price" name="daily_price" placeholder="0.00" type="number"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-[#101b30]">
<span class="material-symbols-outlined">payments</span>
</div>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="total_price">السعر الإجمالي</label>
<div class="relative">
<input class="w-full bg-surface-container-high text-on-surface rounded-lg border border-[#415A77]/30 h-12 px-4 font-headline-md text-headline-md pr-10 text-right shadow-inner cursor-not-allowed text-primary-container" id="total_price" name="total_price" readonly="" type="text" value="0.00"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-primary-container">
<span class="material-symbols-outlined">receipt_long</span>
</div>
</div>
</div>
</div>
</fieldset>
<hr class="border-[#415A77]/20 my-2"/>
<!-- Form Section: Additional Info -->
<fieldset class="flex flex-col gap-md">
<legend class="sr-only">معلومات إضافية</legend>
<div class="flex flex-col gap-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant text-right">مصدر الحجز</span>
<div class="flex flex-row-reverse rounded-lg overflow-hidden border border-[#415A77]/50 p-1 bg-surface-container-low h-14 w-full md:w-2/3 mx-auto shadow-inner">
<label class="flex-1 text-center relative cursor-pointer group">
<input checked="" class="peer sr-only" name="booking_source" type="radio" value="direct"/>
<div class="h-full flex items-center justify-center font-label-lg text-label-lg text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:shadow-sm rounded-md transition-all duration-200">
<span class="material-symbols-outlined ml-2 text-[20px]">person_check</span>
                                مباشر
                            </div>
</label>
<label class="flex-1 text-center relative cursor-pointer group">
<input class="peer sr-only" name="booking_source" type="radio" value="broker"/>
<div class="h-full flex items-center justify-center font-label-lg text-label-lg text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:shadow-sm rounded-md transition-all duration-200">
<span class="material-symbols-outlined ml-2 text-[20px]">handshake</span>
                                سمسار
                            </div>
</label>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant text-right" for="notes">ملاحظات (اختياري)</label>
<textarea class="w-full bg-white text-on-tertiary-fixed rounded-lg border-none focus:ring-2 focus:ring-primary p-4 font-body-md text-body-md text-right shadow-sm placeholder:text-gray-400 resize-none" id="notes" name="notes" placeholder="أضف أي ملاحظات خاصة بالحجز هنا..." rows="3"></textarea>
</div>
</fieldset>
</form>
<!-- Action Area -->
<div class="mt-4 pb-8">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-sm text-headline-sm flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors shadow-[0_4px_14px_0_rgba(0,180,216,0.39)] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="submit">
<span class="material-symbols-outlined icon-fill">save</span>
                حفظ الحجز
            </button>
</div>
</main>
</body></html>
