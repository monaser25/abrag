</div>
</div>
</header>
<div class="bg-surface-container-low border border-outline-variant/30 rounded-xl p-md md:p-lg shadow-lg flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface text-right" for="buildingName">اسم العمارة</label>
<input class="bg-surface-bright border border-outline/30 text-on-surface text-body-md font-body-md rounded-lg p-3 w-full focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors placeholder:text-on-surface-variant/50" id="buildingName" placeholder="مثال: عمارة الياسمين" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-sm font-label-sm text-on-surface text-right" for="buildingAddress">العنوان</label>
