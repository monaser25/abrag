        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

    body {

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col justify-center items-center p-container-margin relative overflow-hidden">
<!-- Subtle Background Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary-container/10 rounded-full blur-[100px] pointer-events-none"></div>
<main class="w-full max-w-sm flex flex-col z-10 relative">
<!-- Logo Section -->
<div class="flex flex-col items-center justify-center mb-xl">
<span class="material-symbols-outlined text-primary text-6xl mb-sm" style="font-size: 48px;">apartment</span>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">أبراج</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">إدارة العقارات بذكاء</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-lg bg-surface-container-low p-lg rounded-2xl border border-outline-variant/30 shadow-2xl">
<div class="flex flex-col gap-md">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">البريد الإلكتروني</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-sm text-outline">mail</span>
<input class="w-full bg-inverse-surface text-inverse-on-surface font-body-md rounded-xl border border-outline-variant pr-10 pl-sm py-3 placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-inner" id="email" placeholder="أدخل بريدك الإلكتروني" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">كلمة المرور</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-sm text-outline">lock</span>
<input class="w-full bg-inverse-surface text-inverse-on-surface font-body-md rounded-xl border border-outline-variant pr-10 pl-sm py-3 placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-inner" id="password" placeholder="أدخل كلمة المرور" type="password"/>
<button class="absolute left-sm text-outline hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">نسيت كلمة المرور؟</a>
</div>
<!-- Login Button -->
<button class="w-full bg-primary-container text-on-background font-label-lg text-label-lg rounded-xl py-3 mt-xs flex items-center justify-center gap-xs hover:bg-primary-fixed transition-colors active:scale-[0.98] shadow-lg shadow-primary-container/20 border border-primary-fixed/20" type="submit">
                تسجيل الدخول
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
</form>
<!-- Footer -->
<div class="mt-xl flex items-center justify-center gap-xs font-body-sm text-body-sm text-on-surface-variant">
<span>ليس لديك حساب؟</span>
<a class="text-primary font-label-sm text-label-sm hover:underline transition-all" href="#">إنشاء حساب</a>
</div>
</main>
</body></html>
