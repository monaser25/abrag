<!-- Main Container -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-container-margin py-lg relative">
<!-- Progress Header -->
<header class="w-full flex items-center justify-between mb-xl">
<div class="text-on-surface-variant font-label-lg text-label-lg whitespace-nowrap">خطوة ١ من ٤</div>
<div class="flex-1 mr-md bg-surface-container-high h-2 rounded-full overflow-hidden border border-outline-variant/20">
<!-- Progress Bar Fill -->
<div class="bg-primary h-full w-1/4 rounded-full relative">
<div class="absolute inset-0 bg-white/20"></div>
</div>
</div>
</header>
<!-- Hero Section -->
<section class="flex flex-col items-center text-center mb-xl pt-lg">
<!-- App Logo Concept -->
<div class="w-24 h-24 bg-surface-container-low border border-outline-variant/30 rounded-2xl flex items-center justify-center mb-lg shadow-lg relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent"></div>
<span class="material-symbols-outlined text-primary text-[48px] drop-shadow-[0_0_8px_rgba(76,214,251,0.3)]">location_city</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary mb-sm">أبراج</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant px-md">مرحباً بك في تطبيق أبراج لإدارة الأملاك</p>
</section>
<!-- Form Section -->
<section class="flex flex-col gap-lg flex-1 w-full bg-surface-container-low/50 p-md rounded-xl border border-outline-variant/20 shadow-sm backdrop-blur-sm">
<!-- Manager Name Input -->
<div class="flex flex-col gap-sm relative">
<label class="text-label-sm font-label-sm text-on-surface-variant text-right" for="manager-name">اسم المدير</label>
<div class="relative">
<input class="w-full bg-surface-container border border-outline-variant/40 text-on-surface text-body-md font-body-md rounded-lg px-md py-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/50" id="manager-name" placeholder="أدخل اسمك الكامل" type="text"/>
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant text-[20px] pointer-events-none">person</span>
</div>
</div>
<!-- Phone Number Input -->
<div class="flex flex-col gap-sm relative">
<label class="text-label-sm font-label-sm text-on-surface-variant text-right" for="phone-number">رقم الهاتف</label>
<div class="flex bg-surface-container border border-outline-variant/40 rounded-lg overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all group">
<!-- Country Code Prefix -->
<div class="flex items-center gap-xs px-sm bg-surface-container-high border-l border-outline-variant/40" dir="ltr">
<span class="text-body-md font-body-md text-on-surface">🇸🇦</span>
<span class="text-body-md font-body-md text-on-surface font-medium mt-[2px]">+966</span>
</div>
<!-- Phone Input Field -->
<input class="flex-1 bg-transparent text-on-surface text-body-md font-body-md px-md py-sm outline-none w-full placeholder:text-on-surface-variant/50 border-none focus:ring-0 text-left" dir="ltr" id="phone-number" placeholder="5X XXX XXXX" type="tel"/>
</div>
</div>
</section>

<footer class="mt-xl pt-md pb-safe-bottom w-full bg-surface">

<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-md rounded-xl hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-[0_0_12px_rgba(76,214,251,0.15)] group relative overflow-hidden">
